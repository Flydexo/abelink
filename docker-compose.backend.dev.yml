services:
  backend:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?A dedicated dev PostgreSQL URL is required}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?A Google Cloud project is required}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-adc.json
      GEMMA_MODEL: ${GEMMA_MODEL:?A verified Vertex generation model is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?A verified Vertex embedding model is required}
      EMBEDDING_DIM: "768"
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PREFER_FREE_SEARCH: ${PREFER_FREE_SEARCH:-true}
      ENRICHMENT_CACHE_PATH: ""
      AUTH_SECRET: ${AUTH_SECRET:?A strong dev JWT signing secret is required}
      LINKCS_IMPORT_TOKEN: ${LINKCS_IMPORT_TOKEN:?A dedicated LinkCS administration token is required}
      CORS_ORIGINS: https://dev.abelink.app
      ALLOW_DEMO_AUTH: "false"
      DEMO_MODE: "false"
      PUBLIC_API_URL: https://dev.abelink.app
      LINKEDIN_LI_AT: ${LINKEDIN_LI_AT:-}
    secrets:
      - source: google_adc
        target: google-adc.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          response = json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5));
          sys.exit(0 if response.get("status") == "ok" and response.get("database", {}).get("backend") == "postgres" and response.get("demo_mode") is False else 1)
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

secrets:
  google_adc:
    environment: GOOGLE_APPLICATION_CREDENTIALS_JSON
